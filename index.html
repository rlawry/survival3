<style>
/* Layout: one screen. Top bar (name, generation track, run controls); dish over graph on the left with game panels laid over it; scoreboard, traits and mutation log in a sidebar. */
:root {
  --bg: #EDF1EC;
  --surface: #F8FAF6;
  --surface-2: #E2E9E1;
  --ink: #15211B;
  --muted: #52645A;
  --line: #C6D0C7;
  --accent: #E7A32A;
  --accent-ink: #1A1405;
  --focus: #0B6B52;
  --you: #4C9A1E;
  --rival: #7651D6;
  --good: #1D7A4B;
  --bad: #B0303F;
  --panel: rgba(248, 250, 246, 0.97);
  --font-display: 'Bricolage Grotesque', 'Avenir Next', 'Segoe UI', sans-serif;
  --font-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-data: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1310; --surface: #121C17; --surface-2: #1B2822; --ink: #E4EEE8; --muted: #93A89D;
    --line: #29392F; --accent: #EDB041; --accent-ink: #1A1405; --focus: #6FD3AE;
    --you: #A5E05A; --rival: #B994FF; --good: #5FD08D; --bad: #F58A98; --panel: rgba(18, 28, 23, 0.97);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1310; --surface: #121C17; --surface-2: #1B2822; --ink: #E4EEE8; --muted: #93A89D;
  --line: #29392F; --accent: #EDB041; --accent-ink: #1A1405; --focus: #6FD3AE;
  --you: #A5E05A; --rival: #B994FF; --good: #5FD08D; --bad: #F58A98; --panel: rgba(18, 28, 23, 0.97);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
.app {
  display: flex; flex-direction: column; gap: 10px; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { font-family: var(--font-display); letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
h1 { font-size: 21px; font-weight: 800; line-height: 1.1; white-space: nowrap; }
h2 { font-size: 24px; font-weight: 800; line-height: 1.1; }
h3 { font-size: 15px; font-weight: 700; line-height: 1.2; }
button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; }

/* top bar */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.track { flex: 1 1 320px; min-width: 0; display: flex; align-items: center; gap: 10px; }
.genLbl { font: 600 13px var(--font-body); white-space: nowrap; }
.genLbl b { font-family: var(--font-data); font-weight: 500; }
.pips { flex: 1 1 auto; display: grid; grid-template-columns: repeat(15, minmax(0, 1fr)); gap: 3px; min-width: 120px; }
.pip { height: 8px; border-radius: 2px; background: var(--surface-2); border: 1px solid var(--line); position: relative; overflow: hidden; }
.pip i { position: absolute; inset: 0; width: 0; background: var(--accent); }
.pip.done i { width: 100%; background: var(--ink); opacity: .55; }
.run { display: flex; gap: 6px; align-items: center; flex: 0 0 auto; }
.btn {
  font: 600 13px var(--font-body); padding: 7px 14px; border-radius: 7px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.big { font-size: 15px; padding: 10px 20px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { font: 500 12px var(--font-data); padding: 7px 9px; border: 0; background: var(--surface); color: var(--ink); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* main */
.main { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.stage { position: relative; display: flex; flex-direction: column; gap: 10px; min-width: 0; min-height: 0; }
.dishBox { position: relative; border-radius: 8px; overflow: hidden; background: #0D1F19; aspect-ratio: 1.6; max-width: 100%; display: flex; align-items: center; justify-content: center; }
#arena { display: block; width: 100%; height: 100%; }
.legend {
  position: absolute; top: 8px; left: 8px; display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 4px 9px; border-radius: 6px;
  background: rgba(8, 20, 15, 0.78); color: #E6F0EA; font-size: 12px; max-width: calc(100% - 16px);
}
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.chartPanel { display: flex; flex-direction: column; gap: 4px; min-height: 0; }
.chartHead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.chartHead span { font-size: 12px; color: var(--muted); }
.chartBox { position: relative; height: 180px; border-radius: 8px; overflow: hidden; background: #0D1F19; }
#chart { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* overlays on the stage */
.overlay {
  position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center;
  padding: 12px; background: rgba(6, 14, 10, 0.55); border-radius: 8px; overflow-y: auto;
}
.card {
  width: min(680px, 100%); max-height: 100%; overflow-y: auto; background: var(--panel); color: var(--ink);
  border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px;
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
}
.eyebrow { margin: 0; font: 500 12px var(--font-data); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.card p { margin: 0; }
.rules { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 5px; }
.versus { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.vs { border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; }
.vs .who { display: flex; align-items: center; gap: 7px; font-weight: 600; }
.vs .big { font: 800 28px var(--font-display); line-height: 1; }
.vs .big small { font: 500 13px var(--font-data); color: var(--muted); margin-left: 6px; }
.vs .row { font-size: 12.5px; color: var(--muted); }
.mut { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.mcard {
  text-align: left; font: inherit; color: var(--ink); background: var(--surface); cursor: pointer;
  border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px;
}
.mcard:hover { border-color: var(--accent); }
.mcard .nm { font: 700 16px var(--font-display); letter-spacing: -0.01em; }
.mcard .tx { font-size: 13px; color: var(--muted); }
.reveal { display: flex; flex-direction: column; gap: 10px; }
.rv { border-radius: 9px; padding: 10px 12px; background: var(--surface-2); display: flex; flex-direction: column; gap: 4px; }
.rv .head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 600; }
.chip { font: 600 11px var(--font-body); letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; border: 1px solid currentColor; }
.chip.good { color: var(--good); } .chip.bad { color: var(--bad); }
.delta { font-size: 13px; }
.up { color: var(--good); font-weight: 600; } .down { color: var(--bad); font-weight: 600; }
.actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.verdict { font: 800 30px var(--font-display); letter-spacing: -0.02em; line-height: 1.05; }

/* sidebar */
.side {
  display: flex; flex-direction: column; gap: 10px; min-width: 0; min-height: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
}
.secT { margin: 0 0 4px; font: 600 11px var(--font-body); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { text-align: right; font: 600 12px var(--font-body); padding: 0 4px 4px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child { text-align: left; color: var(--muted); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; }
th .ico { vertical-align: -2px; margin-right: 4px; }
td { padding: 3px 4px; border-bottom: 1px solid var(--line); }
td.num { text-align: right; font-family: var(--font-data); font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.alive td { font-weight: 600; font-size: 14px; }
td .lead { color: var(--good); }
.floorNote { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
.flash { animation: flash 2.4s ease-out 1; }
@keyframes flash { 0% { background: color-mix(in srgb, var(--accent) 45%, transparent); } 100% { background: transparent; } }
.log { flex: 1 1 auto; min-height: 70px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; }
.log .ent { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 2px 6px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.log .g { font-family: var(--font-data); color: var(--muted); grid-row: span 2; }
.log .empty { color: var(--muted); }
.ico { flex: 0 0 auto; }

@media (min-width: 760px) and (min-height: 540px) {
  .app { height: 100%; overflow: hidden; }
  .main { flex: 1 1 auto; display: grid; grid-template-columns: minmax(0, 1fr) clamp(300px, 29vw, 370px); }
  .dishBox { flex: 1 1 64%; aspect-ratio: auto; min-height: 0; }
  .chartPanel { flex: 1 1 36%; min-height: 110px; max-height: 240px; }
  .chartBox { flex: 1 1 auto; height: auto; min-height: 0; }
  #arena { position: absolute; width: auto; height: auto; }
  .side { overflow: hidden; }
}
@media (max-width: 560px) { .mut, .versus { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { .flash { animation: none; } }
</style>

<div class="app">
  <header class="top">
    <h1>Mutation Showdown</h1>
    <div class="track">
      <span class="genLbl">Generation <b id="genNum">1</b> of 15</span>
      <div class="pips" id="pips" aria-hidden="true"></div>
    </div>
    <div class="run">
      <button type="button" class="btn" id="pause" disabled>Pause</button>
      <div class="seg" role="group" aria-label="Game speed" id="speed">
        <button type="button" data-speed="1" aria-pressed="false">1×</button>
        <button type="button" data-speed="2" aria-pressed="true">2×</button>
        <button type="button" data-speed="4" aria-pressed="false">4×</button>
        <button type="button" data-speed="8" aria-pressed="false">8×</button>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="stage" id="stage">
      <div class="dishBox" id="dishBox">
        <canvas id="arena" role="img" aria-label="The environment: food, your species, the rival species and predators. The sidebar lists the counts."></canvas>
        <div class="legend" id="legend"></div>
      </div>
      <section class="chartPanel" aria-label="Population graph">
        <div class="chartHead"><h3>Population over 15 generations</h3><span>Living creatures of each species</span></div>
        <div class="chartBox" id="chartBox"><canvas id="chart" role="img" aria-label="Line graph comparing the populations of your species and the rival species over time."></canvas></div>
      </section>
      <div class="overlay" id="overlay"><div class="card" id="panel" role="dialog" aria-modal="false" aria-labelledby="panelTitle"></div></div>
    </div>

    <aside class="side" aria-label="Scoreboard, traits and mutation log">
      <section>
        <h3 class="secT">Scoreboard</h3>
        <table>
          <thead><tr><th>Totals</th><th id="thYou"></th><th id="thRival"></th></tr></thead>
          <tbody id="score"></tbody>
        </table>
        <p class="floorNote" id="floorNote" hidden></p>
      </section>
      <section>
        <h3 class="secT">Traits</h3>
        <table>
          <thead><tr><th>Trait</th><th id="thYou2"></th><th id="thRival2"></th></tr></thead>
          <tbody id="traits"></tbody>
        </table>
      </section>
      <section style="display:flex;flex-direction:column;min-height:0;flex:1 1 auto">
        <h3 class="secT">Mutation log</h3>
        <div class="log" id="log"><p class="empty">Mutations you and the rival receive will be listed here.</p></div>
      </section>
    </aside>
  </main>
</div>

<script>

var FOOD = {

  { id: 'legs', kind: 'movement', fx: { speed: 4 },

function clampTrait(k, v) { var l = LIMITS[k]; return Math.max(l[0], Math.min(l[1], v)); }
function applyMutation(traits, m) {
  var before = {}, k;
  for (k in m.fx) { before[k] = traits[k]; traits[k] = clampTrait(k, traits[k] + m.fx[k]); }

  var n = 0; for (var i = 0; i < spState.picks.length; i++) if (spState.picks[i].id === m.id) n++; return n;

    '<div class="actions"><button type="button" class="btn primary big" data-act="next" data-focus>Start generation ' + (game.gen + 1) + '</button></div>');
}
function showResults() {
  var y = game.count('you'), r = game.count('rival');
  var verdict = y > r ? 'Your species wins!' : (r > y ? 'The rival species wins' : 'It’s a tie');
  var sub = y > r ? 'Your species outnumbers the rival ' + y + ' to ' + r + ' after 15 generations.'
    : (r > y ? 'The rival outnumbers your species ' + r + ' to ' + y + ' after 15 generations.' : 'Both species finished with ' + y + ' creatures.');
  var helpful = game.sp.you.picks.filter(function (m) { return m.kind !== 'harmful'; }).length;
  var rhelpful = game.sp.rival.picks.filter(function (m) { return m.kind !== 'harmful'; }).length;
  function tot(sp) {
    var s = game.sp[sp].stats;
    return '<div class="vs"><div class="who">' + icon(sp, 14) + NAME[sp] + '</div><div class="big">' + game.count(sp) + '</div>' +
      '<div class="row">Total born ' + s.born + ' · Starved ' + s.starved + ' · Eaten ' + s.eaten + ' · Old age ' + s.old + '</div>' +
      '<div class="row">Helpful mutations: ' + (sp === 'you' ? helpful : rhelpful) + ' of ' + game.sp[sp].picks.length + '</div></div>';
  }
  openPanel('<p class="eyebrow">Generation 15 complete</p><div class="verdict" id="panelTitle">' + verdict + '</div><p>' + sub + '</p>' +
    '<div class="versus">' + tot('you') + tot('rival') + '</div>' +
    '<p>Look back through the mutation log. Which mutations helped your species most, and how did the predators and food supply decide which ones mattered?</p>' +
    '<div class="actions"><button type="button" class="btn" data-act="hide">View the dish</button><button type="button" class="btn primary big" data-act="again" data-focus>Play again</button></div>');
}
panel.addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  if (b.dataset.pick !== undefined) { pick(parseInt(b.dataset.pick, 10)); return; }
  var act = b.dataset.act;
  if (act === 'start') { closePanel(); beginGeneration(); }
  else if (act === 'next') { game.gen++; game.snapshotGen(); closePanel(); beginGeneration(); }
  else if (act === 'again') newGame();
  else if (act === 'hide') { closePanel(); pauseBtn.disabled = false; pauseBtn.textContent = 'Show results'; }
});

/* ---------- generation flow ---------- */
var pauseBtn = $('pause');
function beginGeneration() {
  genAlive = { you: game.count('you'), rival: game.count('rival') };
  phase = 'running'; pauseBtn.disabled = false; pauseBtn.textContent = 'Pause';
  updateTop();
}
function endGeneration() {
  record();
  pauseBtn.disabled = true;
  renderScore();
  if (game.gen >= GENERATIONS) { phase = 'over'; showResults(); }
  else { phase = 'choose'; showChoice(); }
  updateTop();
}
pauseBtn.addEventListener('click', function () {
  if (phase === 'running') { phase = 'paused'; pauseBtn.textContent = 'Resume'; }
  else if (phase === 'paused') { phase = 'running'; pauseBtn.textContent = 'Pause'; }
  else if (phase === 'over') { showResults(); pauseBtn.disabled = true; }
});
$('speed').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  speed = parseInt(b.dataset.speed, 10);
  var all = $('speed').children;
  for (var i = 0; i < all.length; i++) all[i].setAttribute('aria-pressed', String(all[i] === b));
});
function updateTop() {
  $('genNum').textContent = game.gen;
  var pips = pipsEl.children, into = Math.max(0, Math.min(1, (game.t - (game.gen - 1) * GEN_LEN) / GEN_LEN));
  for (var i = 0; i < pips.length; i++) {
    var done = i < game.gen - 1 || (i === game.gen - 1 && (phase === 'choose' || phase === 'reveal' || phase === 'over'));
    pips[i].className = 'pip' + (done ? ' done' : '');
    pips[i].firstChild.style.width = done ? '' : (i === game.gen - 1 ? (into * 100) + '%' : '0');
  }
}

/* ---------- sidebar ---------- */
function renderScore() {
  var rows = [['Alive', function (sp) { return game.count(sp); }, true],
              ['Born', function (sp) { return game.sp[sp].stats.born; }],
              ['Starved', function (sp) { return game.sp[sp].stats.starved; }],
              ['Eaten by predators', function (sp) { return game.sp[sp].stats.eaten; }],
              ['Died of old age', function (sp) { return game.sp[sp].stats.old; }],
              ['Escaped an attack', function (sp) { return game.sp[sp].stats.escaped; }]];
  var h = '';
  rows.forEach(function (r) {
    var a = r[1]('you'), b = r[1]('rival');
    h += '<tr' + (r[2] ? ' class="alive"' : '') + '><td>' + r[0] + '</td><td class="num">' + (r[2] && a > b ? '<span class="lead">' + a + '</span>' : a) +
      '</td><td class="num">' + (r[2] && b > a ? '<span class="lead">' + b + '</span>' : b) + '</td></tr>';
  });
  $('score').innerHTML = h;
  var fl = [];
  ['you', 'rival'].forEach(function (sp) { if (game.count(sp) <= FLOOR) fl.push(sp === 'you' ? 'Your species is' : 'The rival is'); });
  var note = $('floorNote');
  note.hidden = !fl.length;
  if (fl.length) note.textContent = fl.join(' and ') + ' down to its last ' + FLOOR + ' survivors, hiding in a refuge. They can’t die out, but they need better traits to grow again.';
}
function renderTraits(flash) {
  var h = '';
  TRAIT_INFO.forEach(function (t) {
    var a = game.sp.you.traits[t.k], b = game.sp.rival.traits[t.k];
    function cell(sp, v) {
      var ch = lastChange[sp][t.k], cls = '';
      if (ch !== undefined && Math.abs(ch - v) > 1e-9) {
        var good = (v - ch) * t.better > 0;
        return '<td class="num' + (flash ? ' flash' : '') + '"><span class="' + (good ? 'up' : 'down') + '">' + t.fmt(v) + (good ? ' ▲' : ' ▼') + '</span></td>';
      }
      return '<td class="num">' + t.fmt(v) + '</td>';
    }
    h += '<tr><td>' + t.label + '</td>' + cell('you', a) + cell('rival', b) + '</tr>';
  });
  $('traits').innerHTML = h;
}
function renderLog() {
  var el = $('log');
  if (!log.length) { el.innerHTML = '<p class="empty">Mutations you and the rival receive will be listed here.</p>'; return; }
  el.innerHTML = log.map(function (e) {
    function line(sp) {
      var x = e[sp], harm = x.m.kind === 'harmful';
      return '<span>' + icon(sp, 11) + ' <b>' + x.name + '</b> <span class="' + (harm ? 'down' : 'up') + '">' + (harm ? '▼' : '▲') + '</span></span>';
    }
    return '<div class="ent"><span class="g">G' + e.gen + '</span>' + line('you') + line('rival') + '</div>';
  }).join('');
}

/* ---------- drawing ---------- */
var dishBox = $('dishBox'), arenaCv = $('arena'), actx = arenaCv.getContext('2d');
var chartBox = $('chartBox'), chartCv = $('chart'), cctx = chartCv.getContext('2d');
var chartW = 600, chartH = 180;
var oneScreen = window.matchMedia('(min-width: 760px) and (min-height: 540px)');
function fitCanvases() {
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  var r = dishBox.getBoundingClientRect(), w, h;
  if (oneScreen.matches) { w = Math.min(r.width, r.height * 1.6); h = w / 1.6; arenaCv.style.width = w + 'px'; arenaCv.style.height = h + 'px'; }
  else { arenaCv.style.width = ''; arenaCv.style.height = ''; w = r.width; h = w / 1.6; }
  arenaCv.width = Math.max(1, Math.round(w * dpr)); arenaCv.height = Math.max(1, Math.round(h * dpr));
  var c = chartBox.getBoundingClientRect();
  chartW = Math.max(1, c.width); chartH = Math.max(1, c.height);
  chartCv.width = Math.round(chartW * dpr); chartCv.height = Math.round(chartH * dpr);
  cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function drawArena() {
  var s = arenaCv.width / W;
  actx.setTransform(s, 0, 0, s, 0, 0); actx.globalAlpha = 1;
  actx.fillStyle = '#0D1F19'; actx.fillRect(0, 0, W, H);
  actx.strokeStyle = 'rgba(160,205,182,0.06)'; actx.lineWidth = 1; actx.beginPath();
  for (var gx = 60; gx < W; gx += 60) { actx.moveTo(gx, 0); actx.lineTo(gx, H); }
  for (var gy = 60; gy < H; gy += 60) { actx.moveTo(0, gy); actx.lineTo(W, gy); }
  actx.stroke();
  var i, f, c;
  // trees: canopy with rings for low, middle and high branches
  game.trees.forEach(function (tr) {
    actx.fillStyle = 'rgba(46,122,68,0.30)'; actx.beginPath(); actx.arc(tr.x, tr.y, TREE.r, 0, 6.283); actx.fill();
    actx.fillStyle = 'rgba(46,122,68,0.30)'; actx.beginPath(); actx.arc(tr.x, tr.y, TREE.bands[0][0], 0, 6.283); actx.fill();
    actx.fillStyle = 'rgba(46,122,68,0.35)'; actx.beginPath(); actx.arc(tr.x, tr.y, TREE.bands[1][0], 0, 6.283); actx.fill();
    actx.strokeStyle = 'rgba(150,215,165,0.35)'; actx.lineWidth = 1.2; actx.beginPath(); actx.arc(tr.x, tr.y, TREE.r, 0, 6.283); actx.stroke();
    actx.fillStyle = '#6B4A2B'; actx.beginPath(); actx.arc(tr.x, tr.y, 4, 0, 6.283); actx.fill();
  });
  actx.fillStyle = FOOD.fruit.color; actx.strokeStyle = 'rgba(10,25,40,0.9)'; actx.lineWidth = 1; actx.beginPath();
  for (i = 0; i < game.food.length; i++) { f = game.food[i]; if (f.type === 'fruit') { actx.moveTo(f.x + 3.6, f.y); actx.arc(f.x, f.y, 3.6, 0, 6.283); } }
  actx.fill(); actx.stroke();
  actx.fillStyle = FOOD.seed.color; actx.beginPath();
  for (i = 0; i < game.food.length; i++) { f = game.food[i]; if (f.type === 'seed') { actx.moveTo(f.x + 3.8, f.y); actx.ellipse(f.x, f.y, 3.8, 2.3, f.rot, 0, 6.283); } }
  actx.fill();
  actx.fillStyle = FOOD.berry.color; actx.beginPath();
  for (i = 0; i < game.food.length; i++) { f = game.food[i]; if (f.type === 'berry') { actx.moveTo(f.x + 4, f.y); actx.arc(f.x, f.y, 4, 0, 6.283); } }
  actx.fill();
  actx.fillStyle = 'rgba(255,255,255,0.55)'; actx.beginPath();
  for (i = 0; i < game.food.length; i++) { f = game.food[i]; if (f.type === 'berry') { actx.moveTo(f.x - 0.4, f.y - 1.4); actx.arc(f.x - 1.4, f.y - 1.4, 1.1, 0, 6.283); } }
  actx.fill();

  actx.lineWidth = 1.2;
  for (i = 0; i < game.creatures.length; i++) {
    c = game.creatures[i];
    actx.globalAlpha = 0.4 + 0.6 * Math.min(1, c.e / 70);
    actx.fillStyle = COL[c.sp]; actx.strokeStyle = 'rgba(255,255,255,0.75)'; actx.beginPath();
    if (c.sp === 'you') actx.arc(c.x, c.y, 7.5, 0, 6.283);
    else {
      for (var k = 0; k < 3; k++) {
        var ang = c.a + k * 2.0944, px = c.x + Math.cos(ang) * 9, py = c.y + Math.sin(ang) * 9;
        if (k === 0) actx.moveTo(px, py); else actx.lineTo(px, py);
      }
      actx.closePath();
    }
    actx.fill(); actx.stroke();
    actx.fillStyle = '#0A1713'; actx.beginPath(); actx.arc(c.x + Math.cos(c.a) * 3.2, c.y + Math.sin(c.a) * 3.2, 1.7, 0, 6.283); actx.fill();
  }
  actx.globalAlpha = 1;
  // predators
  game.preds.forEach(function (p) {
    actx.save(); actx.translate(p.x, p.y); actx.rotate(p.a);
    actx.globalAlpha = p.rest > 0 ? 0.45 : 1;
    actx.fillStyle = COL.pred; actx.strokeStyle = 'rgba(255,255,255,0.8)'; actx.lineWidth = 1.4;
    actx.beginPath(); actx.moveTo(15, 0); actx.lineTo(-10, -10); actx.lineTo(-4, 0); actx.lineTo(-10, 10); actx.closePath();
    actx.fill(); actx.stroke();
    actx.restore();
    if (p.tgt && p.rest <= 0) {
      actx.globalAlpha = 0.35; actx.strokeStyle = COL.pred; actx.lineWidth = 1; actx.setLineDash([3, 4]);
      actx.beginPath(); actx.moveTo(p.x, p.y); actx.lineTo(p.tgt.x, p.tgt.y); actx.stroke(); actx.setLineDash([]); actx.globalAlpha = 1;
    }
  });
  if (!reduceMotion) {
    for (i = 0; i < fx.length; i++) {
      var e = fx[i];
      if (e.kind === 'birth') {
        var pr = e.age / 0.5; actx.globalAlpha = 1 - pr; actx.strokeStyle = COL[e.sp]; actx.lineWidth = 1.5;
        actx.beginPath(); actx.arc(e.x, e.y, 8 + pr * 14, 0, 6.283); actx.stroke();
      } else if (e.kind === 'eaten') {
        var q = e.age / 0.9; actx.globalAlpha = 1 - q; actx.fillStyle = COL.pred;
        for (var s2 = 0; s2 < 6; s2++) { var a2 = s2 * 1.047; actx.beginPath(); actx.arc(e.x + Math.cos(a2) * (4 + q * 14), e.y + Math.sin(a2) * (4 + q * 14), 2, 0, 6.283); actx.fill(); }
      } else if (e.kind === 'starved') {
        actx.globalAlpha = 1 - e.age; actx.strokeStyle = '#F58A98'; actx.lineWidth = 2; actx.beginPath();
        actx.moveTo(e.x - 4, e.y - 4); actx.lineTo(e.x + 4, e.y + 4); actx.moveTo(e.x + 4, e.y - 4); actx.lineTo(e.x - 4, e.y + 4); actx.stroke();
      } else if (e.kind === 'escape') {
        actx.globalAlpha = 1 - e.age / 0.9; actx.strokeStyle = '#FFFFFF'; actx.lineWidth = 2;
        actx.beginPath(); actx.arc(e.x, e.y, 11, 0, 6.283); actx.stroke();
      } else {
        actx.globalAlpha = 0.6 * (1 - e.age / 0.8); actx.fillStyle = '#C9D6CE';
        actx.beginPath(); actx.arc(e.x, e.y, 3, 0, 6.283); actx.fill();
      }
    }
    actx.globalAlpha = 1;
  }
}
function stepFx(dtReal) {
  var ev = game.events;
  for (var i = 0; i < ev.length; i++) fx.push({ kind: ev[i].kind, x: ev[i].x, y: ev[i].y, sp: ev[i].sp, age: 0 });
  ev.length = 0;
  if (fx.length > 160) fx.splice(0, fx.length - 160);
  var keep = [];
  for (var j = 0; j < fx.length; j++) { fx[j].age += dtReal; if (fx[j].age < (fx[j].kind === 'birth' ? 0.5 : 0.9)) keep.push(fx[j]); }
  fx = reduceMotion ? [] : keep;
}
function niceStep(range, maxTicks) {
  var raw = range / maxTicks, pow = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10));
  var opts = [1, 2, 5, 10];
  for (var i = 0; i < opts.length; i++) if (opts[i] * pow >= raw) return opts[i] * pow;
  return 10 * pow;
}
var MONO = '11px "IBM Plex Mono", ui-monospace, Menlo, monospace';
function drawChart() {
  var VW = chartW, VH = chartH;
  cctx.clearRect(0, 0, VW, VH); cctx.fillStyle = '#0D1F19'; cctx.fillRect(0, 0, VW, VH);
  var L = 36, R = 34, T = 12, B = 22, pw = VW - L - R, ph = VH - T - B;
  if (pw < 20 || ph < 20) return;
  cctx.font = MONO; cctx.textBaseline = 'middle';
  var tMax = GEN_LEN * GENERATIONS, top = 20;
  history.forEach(function (h) { top = Math.max(top, h.you, h.rival); });
  var yStep = niceStep(top * 1.05, Math.max(2, Math.min(5, Math.floor(ph / 28)))), yMax = Math.ceil(top * 1.05 / yStep) * yStep;
  function X(t) { return L + t / tMax * pw; }
  function Y(n) { return T + ph - n / yMax * ph; }
  // current generation band
  if (phase !== 'over') {
    cctx.fillStyle = 'rgba(237,176,65,0.08)';
    cctx.fillRect(X((game.gen - 1) * GEN_LEN), T, X(game.gen * GEN_LEN) - X((game.gen - 1) * GEN_LEN), ph);
  }
  cctx.strokeStyle = 'rgba(160,205,182,0.14)'; cctx.lineWidth = 1; cctx.fillStyle = '#9FB5AA'; cctx.textAlign = 'right';
  for (var v = 0; v <= yMax + 1e-9; v += yStep) {
    cctx.beginPath(); cctx.moveTo(L, Math.round(Y(v)) + 0.5); cctx.lineTo(L + pw, Math.round(Y(v)) + 0.5); cctx.stroke();
    cctx.fillText(String(v), L - 7, Y(v));
  }
  cctx.textAlign = 'center';
  var every = pw / GENERATIONS < 22 ? 2 : 1;
  for (var gIdx = 0; gIdx <= GENERATIONS; gIdx++) {
    var gxp = Math.round(X(gIdx * GEN_LEN)) + 0.5;
    cctx.beginPath(); cctx.moveTo(gxp, T); cctx.lineTo(gxp, T + ph); cctx.stroke();
    if (gIdx < GENERATIONS && (gIdx % every === 0)) cctx.fillText(String(gIdx + 1), X((gIdx + 0.5) * GEN_LEN), VH - 10);
  }
  ['rival', 'you'].forEach(function (sp) {
    cctx.strokeStyle = COL[sp]; cctx.lineWidth = sp === 'you' ? 2.6 : 2.2; cctx.lineJoin = 'round'; cctx.beginPath();
    history.forEach(function (h, i) { var px = X(h.t), py = Y(h[sp]); if (i === 0) cctx.moveTo(px, py); else cctx.lineTo(px, py); });
    cctx.stroke();
  });
  if (history.length) {
    var last = history[history.length - 1], ends = [
      { y: Y(last.you), n: last.you, c: COL.you }, { y: Y(last.rival), n: last.rival, c: COL.rival }].sort(function (a, b) { return a.y - b.y; });
    ends[0].ly = ends[0].y; ends[1].ly = Math.max(ends[1].y, ends[0].ly + 13);
    cctx.textAlign = 'left';
    ends.forEach(function (e) {
      cctx.fillStyle = e.c; cctx.beginPath(); cctx.arc(X(last.t), e.y, 3.5, 0, 6.283); cctx.fill();
      cctx.fillText(String(e.n), X(last.t) + 7, Math.min(e.ly, T + ph));
    });
  }
}

/* ---------- loop ---------- */
var lastTs = 0, acc = 0, uiAcc = 0, chartAcc = 0;
function frame(ts) {
  var dtReal = Math.min(0.1, (ts - lastTs) / 1000); lastTs = ts;
  if (phase === 'running') {
    acc += dtReal * speed;
    var steps = 0, genEnd = game.gen * GEN_LEN;
    while (acc >= DT && steps < 30 && phase === 'running') {
      game.step(DT); acc -= DT; steps++;
      if (game.t - lastSample >= 1 - 1e-9) record();
      if (game.t >= genEnd - 1e-9) { acc = 0; endGeneration(); }
    }
    if (steps >= 30) acc = 0;
  }
  stepFx(dtReal);
  drawArena();
  chartAcc += dtReal; if (chartAcc > 0.15) { chartAcc = 0; drawChart(); }
  uiAcc += dtReal; if (uiAcc > 0.25) { uiAcc = 0; if (phase === 'running' || phase === 'paused') { renderScore(); updateTop(); } }
  requestAnimationFrame(frame);
}
function onResize() { fitCanvases(); drawArena(); drawChart(); }
if (window.ResizeObserver) { new ResizeObserver(onResize).observe(dishBox); new ResizeObserver(onResize).observe(chartBox); }
else window.addEventListener('resize', onResize);
fitCanvases();
newGame();
window.__game = function () { return { phase: phase, gen: game.gen }; };
requestAnimationFrame(function (ts) { lastTs = ts; requestAnimationFrame(frame); });
})();
</script>
